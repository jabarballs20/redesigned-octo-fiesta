services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: g2leafy-panel
    ports:
      - "${PANEL_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PANEL_PORT: 8080
      DB_PATH: /data/panel.db
      XRAY_CONFIG_PATH: /data/xray/config.json
      XRAY_STATE_PATH: /data/xray/runtime-state.json
      XRAY_COMMAND: ${XRAY_COMMAND:-xray run -c /data/xray/config.json}
      XRAY_ENABLED: ${XRAY_ENABLED:-0}
    volumes:
      - g2leafy_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  g2leafy_data:
